<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot Meter - Live Test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: #12171c; color: #e6ebf0; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 16px;
           background: #1b232b; border-bottom: 1px solid #2b3641; }
  h1 { font-size: 18px; margin: 0; }
  .stat { font-size: 14px; color: #aab6c2; }
  .stat b { color: #e6ebf0; font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
  button { background: #2b6cb0; color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
  button.secondary { background: #34414e; }
  button.danger { background: #b04a2b; }
  button:hover { filter: brightness(1.15); }
  #notice { display: none; margin: 0 16px 8px; padding: 8px 12px; border-radius: 6px; background: #3b3320; color: #f2d98a; font-size: 14px; }
  .filters { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 0 16px 8px; font-size: 14px; color: #aab6c2; }
  select { background: #1b232b; color: #e6ebf0; border: 1px solid #2b3641; border-radius: 6px; padding: 4px 8px; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #222c35; white-space: nowrap; }
  th { position: sticky; top: 0; background: #1b232b; color: #aab6c2; font-weight: 600; }
  tr.wrong td { background: #3a2a1a; color: #f0b27a; }
  tr.wrong td.name { text-decoration: line-through; }
  #empty { padding: 24px 16px; color: #7f8c99; }
</style>
</head>
<body>
<header>
  <h1>Live test</h1>
  <span class="stat">Server: <b id="link">connecting...</b></span>
  <span class="stat">Sensor: <b id="conn">--</b></span>
  <span class="stat">State: <b id="device">--</b></span>
  <span class="stat">Session time: <b id="timer">0:00.000</b></span>
  <span class="stat">Events: <b id="count">0</b></span>
  <span class="stat">Marked wrong: <b id="flagged">0</b></span>
</header>

<div class="controls">
  <button data-cmd="connect">Connect</button>
  <button data-cmd="calibrate">Calibrate</button>
  <button data-cmd="start_session">Start session</button>
  <button class="danger" data-cmd="stop_session">Stop and save</button>
  <button class="secondary" id="csv">Download CSV</button>
</div>

<div id="notice"></div>

<div class="filters">
  <label>Order
    <select id="sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </label>
  <label><input type="checkbox" id="onlyFlagged"> Only events marked wrong</label>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>#</th><th>Clock time</th><th>Session time</th><th>Class</th>
        <th>Peak g</th><th>Peak dps</th><th>Confidence</th><th>Mark</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  <div id="empty">No events yet. Calibrate, then start a session.</div>
</div>

<script>
  const els = {
    link: document.getElementById("link"),
    conn: document.getElementById("conn"),
    device: document.getElementById("device"),
    timer: document.getElementById("timer"),
    count: document.getElementById("count"),
    flagged: document.getElementById("flagged"),
    notice: document.getElementById("notice"),
    sort: document.getElementById("sort"),
    onlyFlagged: document.getElementById("onlyFlagged"),
    body: document.getElementById("body"),
    empty: document.getElementById("empty"),
  };

  let ws = null;
  let snap = null;
  let events = [];
  let noticeTimer = null;

  function pad(n, width) { return String(n).padStart(width, "0"); }

  // 83250 ms -> "1:23.250"
  function fmtSession(ms) {
    ms = Math.max(0, Math.round(ms));
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    return m + ":" + pad(s, 2) + "." + pad(ms % 1000, 3);
  }

  // "2026-11-22T17:48:03.250" -> "17:48:03.250"
  function fmtClock(iso) {
    const parts = String(iso).split("T");
    return parts.length > 1 ? parts[1] : String(iso);
  }

  function showNotice(text) {
    els.notice.textContent = text;
    els.notice.style.display = "block";
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { els.notice.style.display = "none"; }, 6000);
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    } else {
      showNotice("Not connected to the server");
    }
  }

  function renderStatus() {
    if (!snap) return;
    els.conn.textContent = snap.connection.message;
    els.device.textContent = snap.device.state || "--";
    els.timer.textContent = fmtSession(snap.session.duration_s * 1000);
  }

  function addCell(row, text, className) {
    const td = document.createElement("td");
    td.textContent = text;
    if (className) td.className = className;
    row.appendChild(td);
  }

  function renderTable() {
    els.count.textContent = events.length;
    els.flagged.textContent = events.filter((e) => e.wrong).length;

    let rows = events.slice();
    if (els.onlyFlagged.checked) rows = rows.filter((e) => e.wrong);
    if (els.sort.value === "newest") rows.reverse();

    els.body.textContent = "";
    for (const e of rows) {
      const tr = document.createElement("tr");
      if (e.wrong) tr.className = "wrong";
      addCell(tr, e.idx);
      addCell(tr, fmtClock(e.clock));
      addCell(tr, fmtSession(e.t_ms));
      addCell(tr, e.name + " (" + e.class + ")", "name");
      addCell(tr, e.peak_g.toFixed(2) + " g");
      addCell(tr, e.peak_dps + " dps");
      addCell(tr, e.confidence);

      const td = document.createElement("td");
      const btn = document.createElement("button");
      btn.className = "secondary";
      btn.textContent = e.wrong ? "Undo" : "Wrong";
      btn.addEventListener("click", () => send({ cmd: e.wrong ? "unflag_event" : "flag_event", id: e.idx }));
      td.appendChild(btn);
      tr.appendChild(td);

      els.body.appendChild(tr);
    }
    els.empty.style.display = rows.length ? "none" : "block";
  }

  function downloadCsv() {
    const header = ["idx", "seq", "clock", "t_ms", "class", "name", "peak_g", "peak_dps", "confidence", "wrong"];
    const lines = [header.join(",")];
    for (const e of events) {
      lines.push([e.idx, e.seq, e.clock, e.t_ms, e.class, e.name, e.peak_g, e.peak_dps, e.confidence, e.wrong ? 1 : 0].join(","));
    }
    const blob = new Blob([lines.join("\n") + "\n"], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "live_test_events_" + new Date().toISOString().replace(/[:.]/g, "-") + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(proto + "://" + location.host + "/ws");
    ws.onopen = () => { els.link.textContent = "connected"; };
    ws.onmessage = (m) => {
      let msg;
      try { msg = JSON.parse(m.data); } catch (err) { return; }
      if (msg.type === "state") { snap = msg.data; renderStatus(); }
      else if (msg.type === "live_events") { events = msg.data; renderTable(); }
      else if (msg.type === "notice") { showNotice(String(msg.message)); }
    };
    ws.onclose = () => {
      els.link.textContent = "offline, retrying...";
      setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
  }

  document.querySelectorAll("button[data-cmd]").forEach((b) => {
    b.addEventListener("click", () => send({ cmd: b.dataset.cmd }));
  });
  document.getElementById("csv").addEventListener("click", downloadCsv);
  els.sort.addEventListener("change", renderTable);
  els.onlyFlagged.addEventListener("change", renderTable);

  connect();
</script>
</body>
</html>
